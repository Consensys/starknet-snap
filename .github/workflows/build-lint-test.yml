name: Build, Lint, Test and Scan

on:
  workflow_call:
    secrets:
      SONAR_TOKEN_WALLET_UI:
        required: true
      SONAR_TOKEN_STARKNET_SNAP:
        required: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install Yarn dependencies
        run: yarn --no-immutable

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Cache NPM tarballs
        id: cache-npm-tarballs
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            node_modules/.cache/npm
          key: npm-tarballs-${{ github.run_id }}
          restore-keys: |
            npm-tarballs
      - run: yarn --no-immutable
      - run: yarn build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn --no-immutable
      - run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn --no-immutable
      - run: yarn build
      - run: yarn test
      - name: Cache Coverage Report
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        id: cache-coverage-report
        with:
          path: |
            ./packages/**/coverage
          key: ${{ github.sha }}-${{ matrix.node-version }}-coverage-report
  
  code-scan-snap:
    name: Scan Starknet Snap
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Node.js 20
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Restore Coverage Report
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        id: restore-coverage-report
        with:
          path: |
            ./packages/**/coverage
          key: ${{ github.sha }}-20.x-coverage-report

      - name: SonarCloud Scan Starknet-Snap
        # This is SonarSource/sonarqube-scan-action@v7.1.0
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        with:
          projectBaseDir: packages/starknet-snap/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_STARKNET_SNAP }}
  
  code-scan-wallet-ui:
    name: Scan Wallet UI
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Node.js 20
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Restore Coverage Report
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        id: restore-coverage-report
        with:
          path: |
            ./packages/**/coverage
          key: ${{ github.sha }}-20.x-coverage-report

      - name: SonarCloud Scan Wallet-UI
        # This is SonarSource/sonarqube-scan-action@v7.1.0
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        with:
          projectBaseDir: packages/starknet-snap/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WALLET_UI }}
